[workspace]
resolver = "2"
members = [
    "crates/lele-rust-function-taxonomy",
    "crates/lele-taxonomy-driver",
]

[workspace.package]
version = "0.0.10"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
atomic-delegate-macros = { git = "https://github.com/Uomocosa/lele-rust-linter", tag = "v0.0.13" }
clap = { version = "=4.6.7", features = ["derive"] }
derive_more = { version = "=2.1.1" }
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.8.23"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tempfile = "=3.27.0"
rstest = "=0.28.0"
lele-rust-function-taxonomy = { path = "crates/lele-rust-function-taxonomy" }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
implicit_hasher = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
explicit_iter_loop = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_like_matches_macro = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
ptr_arg = "allow"
redundant_clone = "allow"
redundant_closure_for_method_calls = "allow"
redundant_pub_crate = "allow"
semicolon_if_nothing_returned = "allow"
single_char_pattern = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unnecessary_trailing_comma = "allow"
unnested_or_patterns = "allow"
used_underscore_binding = "allow"
use_self = "allow"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
