[[lele.boundary]]
name    = "honesty decision core"
why     = "The witness fixpoint is what decides honesty, so it must not reach hidden I/O itself."
folders = ["crates/lele-rust-function-taxonomy/__methods__/honesty_graph", "crates/lele-taxonomy-driver/src/roots"]
require = "honest"

[honesty]
declared_honest = []
declared_dishonest = []

[[lele.lint.entry_points]]
file = "crates/lele-rust-function-taxonomy/src/run.rs"
fn = "run"
reason = "the crate's single operation: main() drives the whole taxonomy check through it"
